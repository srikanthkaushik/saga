server:
  port: 8080
  # Unauthenticated test tooling: local machine only
  address: 127.0.0.1

spring:
  application:
    name: saga-ui
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: saga-console
            # Development secret from docker/keycloak/saga-realm.json; override via SAGA_CONSOLE_CLIENT_SECRET
            client-secret: ${SAGA_CONSOLE_CLIENT_SECRET:saga-console-dev-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          keycloak:
            # Fetched at startup: Keycloak must be up before the console starts
            issuer-uri: http://localhost:8180/realms/saga
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # fail fast in the UI when Kafka is down instead of blocking for the 60s default
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

saga:
  ui:
    services:
      order: http://localhost:8081
      payment: http://localhost:8082
      inventory: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health
