server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: saga
    password: saga
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm "saga" (docker-compose). Tokens must carry aud=saga-api; roles come from the "roles" claim.
          issuer-uri: http://localhost:8180/realms/saga
          audiences: saga-api
          authorities-claim-name: roles
          authority-prefix: ROLE_
          principal-claim-name: preferred_username
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # one consumer thread per partition: a record in blocking retry stalls only its own partition
      concurrency: 3

saga:
  outbox:
    poll-interval: 500ms
    batch-size: 100
  kafka:
    retry:
      max-retries: 4
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,dlt,outbox
