services:
  postgres:
    image: postgres:17
    container_name: saga-postgres
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - saga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: saga-kafka
    ports:
      - "9092:9092"
    volumes:
      - saga-kafka-data:/var/lib/kafka/data
    environment:
      # KRaft storage is formatted with this id on first start; a persisted log dir refuses a different one.
      # Never change it without also removing the volume (docker compose down -v).
      CLUSTER_ID: _i2hTKrTS761Uu_cNefu5Q
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: PLAINTEXT for apps on the host (localhost:9092),
      # DOCKER for containers on the compose network such as AKHQ (kafka:29092, not published).
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Kafka web UI: topics, messages with headers, consumer groups and lag. http://localhost:8086
  # Read-write and unauthenticated - local development only.
  akhq:
    image: tchiotludo/akhq:0.28.0
    container_name: saga-akhq
    depends_on:
      - kafka
    ports:
      - "8086:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            saga-local:
              properties:
                bootstrap.servers: "kafka:29092"

  # Identity provider for the services, the console, curl and Prometheus. http://localhost:8180 (admin console: admin/admin)
  # Development mode: no persistent state; the 'saga' realm (roles, clients, dev users) is re-imported on every start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: saga-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/saga-realm.json:/opt/keycloak/data/import/saga-realm.json:ro

volumes:
  saga-postgres-data:
  saga-kafka-data:
