# The whole saga dev stack for an Unraid server (Docker Compose Manager plugin) or any single Docker host.
# Everything configurable is in .env (copy .env.example). Images come from ${SAGA_REGISTRY}, built and pushed
# with ops\images.cmd. Guide: deploy/unraid/README.md
#
# Browsers and the containers both reach Keycloak at http://${SAGA_HOST}:${KEYCLOAK_PORT}: that URL is the token
# issuer, so it must be the same everywhere. Services talk to Kafka and Postgres over the compose network.
name: saga

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    keycloak: { condition: service_healthy }

x-app-env: &app-env
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://${SAGA_HOST}:${KEYCLOAK_PORT}/realms/saga
  TZ: ${TZ}

services:
  postgres:
    image: ${SAGA_REGISTRY}/saga-postgres:${SAGA_TAG}
    container_name: saga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: saga
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${APPDATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-start initialisation Postgres listens only on its Unix socket,
      # so a socket check would report "ready" while the services' TCP connections are still refused
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka runs as uid 1000; make the appdata folder (created root-owned by Docker) writable for it
  kafka-init:
    image: busybox:1.37
    container_name: saga-kafka-init
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - ${APPDATA}/kafka:/data

  kafka:
    image: apache/kafka:4.0.0
    container_name: saga-kafka
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - ${APPDATA}/kafka:/var/lib/kafka/data
    environment:
      # Formatted into the data folder on first start; never change it while the folder has data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for clients outside Docker (your PC), DOCKER for the containers in this stack
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${SAGA_HOST}:${KAFKA_PORT},DOCKER://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  akhq:
    image: tchiotludo/akhq:0.28.0
    container_name: saga-akhq
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "${AKHQ_PORT}:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            saga:
              properties:
                bootstrap.servers: "kafka:29092"

  keycloak:
    image: ${SAGA_REGISTRY}/saga-keycloak:${SAGA_TAG}
    container_name: saga-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fixed public URL: the issuer of every token, whichever address a request used
      KC_HOSTNAME: http://${SAGA_HOST}:${KEYCLOAK_PORT}
      KC_HEALTH_ENABLED: "true"
      # Placeholders in the baked-in saga realm
      SAGA_CONSOLE_URL: http://${SAGA_HOST}:${CONSOLE_PORT}
      SAGA_CONSOLE_CLIENT_SECRET: ${SAGA_CONSOLE_CLIENT_SECRET}
      SAGA_PROMETHEUS_CLIENT_SECRET: ${SAGA_PROMETHEUS_CLIENT_SECRET}
      SAGA_VIEWER_PASSWORD: ${SAGA_VIEWER_PASSWORD}
      SAGA_OPERATOR_PASSWORD: ${SAGA_OPERATOR_PASSWORD}
      SAGA_ADMIN_PASSWORD: ${SAGA_ADMIN_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      # The image has no curl: ask the management port with bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  order-service:
    <<: *app
    image: ${SAGA_REGISTRY}/saga-order-service:${SAGA_TAG}
    container_name: saga-order-service
    ports:
      - "${ORDER_PORT}:8081"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    <<: *app
    image: ${SAGA_REGISTRY}/saga-payment-service:${SAGA_TAG}
    container_name: saga-payment-service
    ports:
      - "${PAYMENT_PORT}:8082"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  inventory-service:
    <<: *app
    image: ${SAGA_REGISTRY}/saga-inventory-service:${SAGA_TAG}
    container_name: saga-inventory-service
    ports:
      - "${INVENTORY_PORT}:8083"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  console:
    image: ${SAGA_REGISTRY}/saga-console:${SAGA_TAG}
    container_name: saga-console
    restart: unless-stopped
    depends_on:
      keycloak: { condition: service_healthy }
      kafka: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    ports:
      - "${CONSOLE_PORT}:8080"
    environment:
      # The image defaults to 127.0.0.1 (local tool); in a container it must listen on all interfaces
      SERVER_ADDRESS: 0.0.0.0
      SAGA_UI_SERVICES_ORDER: http://order-service:8081
      SAGA_UI_SERVICES_PAYMENT: http://payment-service:8082
      SAGA_UI_SERVICES_INVENTORY: http://inventory-service:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://${SAGA_HOST}:${KEYCLOAK_PORT}/realms/saga
      SAGA_CONSOLE_CLIENT_SECRET: ${SAGA_CONSOLE_CLIENT_SECRET}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
